<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendWise Interactive</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Budget Dashboard</p>
          <h1>SpendWise</h1>
        </div>
        <button id="reset-budget" class="secondary-btn" type="button">Reset Budget</button>
      </header>

      <section class="budget-panel card">
        <div class="panel-header">
          <h2>Monthly Budget</h2>
        </div>
        <div class="budget-input-row">
          <label for="budget-input">Set your monthly budget</label>
          <div class="input-wrap">
            <span>$</span>
            <input id="budget-input" type="number" min="0" step="0.01" value="2500" />
          </div>
          <button id="save-budget" class="primary-btn" type="button">Update Budget</button>
        </div>
      </section>

      <section class="stats-grid">
        <article class="stat-card card">
          <p>Total Budget</p>
          <h3 id="total-budget">$0.00</h3>
        </article>
        <article class="stat-card card">
          <p>Expenses</p>
          <h3 id="total-expenses">$0.00</h3>
        </article>
        <article class="stat-card card accent">
          <p>Remaining</p>
          <h3 id="remaining-budget">$0.00</h3>
        </article>
      </section>

      <section class="dashboard-grid">
        <div class="card">
          <div class="panel-header">
            <h2>Add Expense</h2>
          </div>

          <form id="expense-form">
            <label for="expense-name">Expense Name</label>
            <input id="expense-name" type="text" placeholder="e.g. Groceries" required />

            <label for="expense-category">Category</label>
            <select id="expense-category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Utilities">Utilities</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health">Health</option>
              <option value="Other">Other</option>
            </select>

            <label for="expense-amount">Amount</label>
            <div class="input-wrap">
              <span>$</span>
              <input id="expense-amount" type="number" min="0.01" step="0.01" placeholder="0.00" required />
            </div>

            <button class="primary-btn" type="submit">Add Expense</button>
          </form>
        </div>

        <div class="card">
          <div class="panel-header">
            <h2>Budget Status</h2>
          </div>
          <div id="budget-status" class="status-box warning">
            Review your spending and keep within your budget.
          </div>
          <ul id="category-summary" class="category-list"></ul>
        </div>
      </section>

      <section class="card table-card">
        <div class="panel-header">
          <h2>Expense List</h2>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="expense-table-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
